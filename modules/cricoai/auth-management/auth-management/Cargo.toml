[package]
name = "auth-management"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# SDK
auth-management-sdk = { path = "../auth-management-sdk" }

# Tenant resolver
tenant-resolver-sdk = { package = "cf-tenant-resolver-sdk", path = "../../../../modules/system/tenant-resolver/tenant-resolver-sdk" }

# Core
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }

# Serde and JSON
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }

# HTTP
axum = { workspace = true, features = ["macros"] }
http = { workspace = true }

# Time
chrono = { workspace = true }

# Lock-free atomic swaps
arc-swap = { workspace = true }

# Database
sea-orm = { workspace = true, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-rust_decimal",
    "with-json",
] }
rust_decimal = { workspace = true }

# Auth / 2FA
bcrypt = { workspace = true }
totp-rs = { workspace = true }
qrcode = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Local dependencies
modkit = { workspace = true }
modkit-db = { workspace = true, features = ["pg"] }
modkit-db-macros = { workspace = true }
modkit-auth = { workspace = true }
modkit-security = { workspace = true }
modkit-errors = { workspace = true }
modkit-macros = { workspace = true }
